<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>校園尋寶護照</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* Layout: a passport. Cover screen → visa page with stamp slots → one station per screen. Stamps are the reward. */
:root{
  --cover:#0d3a5a; --cover2:#0a2d47; --gold:#e5b544; --page:#edf5f1; --guil:#d4e7df;
  --ink:#15252d; --muted:#4b616c; --line:#bcd3ca; --card:#ffffff; --ok:#1f8a5b; --bad:#c8372d; --warn:#fff2c9;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--ink)}
body{min-height:100vh;font-family:var(--f-body);font-size:17px;line-height:1.6;
  background-image:repeating-radial-gradient(circle at 50% -20%,transparent 0 14px,var(--guil) 14px 15px);}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:24px;font-weight:900}
h3{font-size:18px;font-weight:900}
.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.mono{font-family:var(--f-mono)}

.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 20px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2;font-size:16px}
.btn.primary{background:var(--cover);border-color:var(--cover);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input.code,input.txt{font:inherit;border:2px solid var(--ink);border-radius:10px;padding:10px 14px;background:var(--card);color:var(--ink);min-width:0;width:100%}
input.code{font-family:var(--f-mono);font-size:22px;letter-spacing:.16em;text-transform:uppercase;text-align:center}
input.ans{font:inherit;font-size:24px;text-align:center;border:2px solid var(--ink);border-radius:10px;padding:10px 14px;background:var(--card);color:var(--ink);width:100%;min-width:0}
.msg{min-height:1.5em;font-weight:700;margin:6px 0 0}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}

/* Cover */
.cover{max-width:460px;margin:24px auto 0;background:linear-gradient(160deg,var(--cover),var(--cover2));color:#fff;border-radius:16px 22px 22px 16px;padding:32px 26px 28px;box-shadow:0 18px 40px rgba(13,58,90,.35), inset 10px 0 0 rgba(0,0,0,.18);position:relative}
.cover .emblem{width:92px;height:92px;border:3px solid var(--gold);border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;color:var(--gold);font-family:var(--f-mono);font-weight:700;font-size:15px;text-align:center;line-height:1.1;outline:1px solid var(--gold);outline-offset:4px}
.cover h1{color:var(--gold);font-size:34px;font-weight:900;text-align:center;letter-spacing:.08em}
.cover .sub{color:#cfe0ec;text-align:center;margin:6px 0 22px;font-size:15px}
.cover label{display:block;font-weight:700;font-size:14px;color:#cfe0ec;margin:14px 0 6px}
.gpick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.gpick button{font:inherit;font-weight:900;font-size:20px;border:2px solid rgba(229,181,68,.6);background:transparent;color:#fff;border-radius:10px;height:50px;cursor:pointer}
.gpick button[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.cover input.txt{border-color:rgba(229,181,68,.6);background:rgba(255,255,255,.08);color:#fff}
.cover input.txt::placeholder{color:#9fb6c7}
.cover .btn{width:100%;justify-content:center;margin-top:22px}
.cover .rules{font-size:14px;color:#cfe0ec;margin:18px 0 0;padding-left:20px}
.cover .demo{background:rgba(255,242,201,.14);border:1px solid var(--gold);border-radius:10px;padding:8px 12px;font-size:14px;color:#ffe9b0;margin-top:14px}

/* Passport page */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cover);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cover)}
.bar-in{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bar b{color:var(--gold)}
.bar .stats{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.bar .stats span{display:flex;flex-direction:column;align-items:center;font-size:11px;letter-spacing:.1em;color:#a9c1d2}
.bar .stats b{font-family:var(--f-mono);font-size:20px;letter-spacing:0;line-height:1.1}
.bar .late b{color:#ff8a7a}
.banner{background:var(--warn);border:2px solid var(--gold);border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:14px}
.visas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
@media (max-width:520px){.visas{grid-template-columns:minmax(0,1fr)}}
.visa{position:relative;background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:16px;min-height:150px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:4px;overflow:hidden}
.visa .no{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.1em}
.visa h3{font-size:19px}
.visa .place{font-size:14px;color:var(--muted)}
.visa .kind{align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--page);color:var(--ink)}
.visa .status{margin-top:auto;font-size:13px;font-weight:700;color:var(--muted)}
.visa.done{border-style:solid;border-color:var(--line)}
.stamp{position:absolute;right:14px;bottom:12px;width:96px;height:96px;border:4px double currentColor;border-radius:50%;display:grid;place-items:center;text-align:center;transform:rotate(-14deg);font-weight:900;line-height:1.05;font-size:13px;opacity:.88;mix-blend-mode:multiply;padding:6px}
.stamp .pts{font-family:var(--f-mono);font-size:24px;display:block}
.stamp.big{position:static;width:170px;height:170px;font-size:18px;margin:10px auto;border-width:7px}
.stamp.big .pts{font-size:44px}
@keyframes thump{0%{transform:scale(2.2) rotate(-30deg);opacity:0}60%{transform:scale(.92) rotate(-12deg);opacity:1}100%{transform:scale(1) rotate(-14deg);opacity:.9}}
.stamp.big{animation:thump .45s ease-out both}
.finish{margin-top:22px;display:flex;justify-content:center}
.lvstar{color:#c98a00;letter-spacing:-1px}
.visa.failed{opacity:.6;border-style:solid}
.tries{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted);margin:2px 0 0}
.tries .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);display:inline-block}
.tries .dot.on{background:var(--ok);border-color:var(--ok)}
/* 出發題：燈泡 */
.gate{max-width:560px;margin:24px auto 0;background:linear-gradient(160deg,var(--cover),var(--cover2));color:#fff;border-radius:16px 22px 22px 16px;padding:26px 22px 24px;box-shadow:0 18px 40px rgba(13,58,90,.35), inset 10px 0 0 rgba(0,0,0,.18);text-align:center}
.gate h1,.show h1{color:var(--gold);font-size:34px;font-weight:900;letter-spacing:.08em;margin:4px 0 0}
.gate .sub,.show .sub{color:#cfe0ec;margin:6px 0 0}
.gbulbs{display:flex;justify-content:center;gap:clamp(8px,3vw,22px);margin:22px 0 14px}
.gb{display:flex;flex-direction:column;align-items:center;width:clamp(42px,13vw,76px)}
.gb .glass{width:100%;aspect-ratio:1;border-radius:50% 50% 44% 44%;background:radial-gradient(circle at 35% 30%,#8a98a1,#45525a);border:3px solid #22313a}
.gb .base{width:44%;height:clamp(12px,3.4vw,20px);background:repeating-linear-gradient(#a3adb3 0 3px,#6d777d 3px 6px);border-radius:0 0 6px 6px;margin-top:-2px}
.gb.on .glass{background:radial-gradient(circle at 35% 30%,#fffbe0,#ffd84d 55%,#e5a91a);border-color:#fff1a8;box-shadow:0 0 18px 6px rgba(255,216,77,.75),0 0 46px 16px rgba(255,200,40,.32)}
.gb .w{font-family:var(--f-mono);font-weight:700;font-size:clamp(16px,3vw,22px);margin-top:6px;color:var(--gold)}
.gb:not(.on) .w{color:#6f8797}
.gbulbs.tiny{justify-content:flex-start;gap:8px;margin:10px 0 4px}
.gbulbs.tiny .gb{width:34px}
.gbulbs.tiny .gb .glass{border-width:2px}
.gbulbs.tiny .gb.on .glass{box-shadow:0 0 8px 2px rgba(255,216,77,.8)}
.gbulbs.huge{margin:2vh 0 1vh}
.gbulbs.huge .gb{width:clamp(60px,min(13vw,17vh),170px)}
.gbulbs.huge .gb .w{font-size:clamp(22px,3.4vw,46px)}
.roomnote{border:2px dashed var(--gold);border-radius:12px;padding:18px 12px;margin:20px 0 14px;font-size:20px;font-weight:900;color:var(--gold)}
.gpanel{background:var(--card);color:var(--ink);border-radius:12px;padding:14px;margin-top:6px}
.gpanel .unlock{max-width:none;margin:0}
.gpanel .btn{justify-content:center}
.ghints{display:grid;gap:8px;margin-top:12px;text-align:left}
.ghint{background:rgba(255,255,255,.1);border-left:5px solid var(--gold);border-radius:8px;padding:8px 12px;color:#fff;animation:pop .45s ease-out}
.ghint b{display:block;color:var(--gold);font-size:12px;letter-spacing:.12em}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}
.gnext{color:#a9c1d2;font-size:14px;margin:10px 0 0;font-variant-numeric:tabular-nums}
.shake{animation:shake .35s}
.gate .ok-eq{font-family:var(--f-mono);font-size:clamp(20px,5vw,28px);color:var(--gold);margin:6px 0 4px}
.show{min-height:100vh;background:linear-gradient(160deg,var(--cover),var(--cover2));color:#fff;text-align:center;padding:20px max(16px,3vw) 40px}
.show h1{font-size:clamp(34px,min(7vw,9vh),86px)}
.show .ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.show .sub{font-size:clamp(18px,2.2vw,28px)}
.show .ghints{max-width:1000px;margin:18px auto 0}
.show .ghint{font-size:clamp(20px,2.6vw,32px)}
.show .ghint b{font-size:clamp(13px,1.3vw,18px)}
.show .gnext{font-size:clamp(16px,1.6vw,22px)}
.show .reveal{font-family:var(--f-mono);font-size:clamp(28px,4.4vw,58px);font-weight:700;color:var(--gold);margin:4px 0 0}
.show .btn{border-color:var(--gold)}
.ed-grid details{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:8px}
.ed-grid details summary{font-size:14px;color:var(--cover)}
.ed-grid details .ed-grid{margin-top:6px}
.ab{font-size:12px;font-weight:700;background:#e4eefb;border:1px solid #2459c4;color:#2459c4;border-radius:999px;padding:0 8px}

/* Station */
.sheet{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:22px;margin-top:14px}
.sheet .head{border-left:8px solid var(--c,var(--cover));padding-left:12px;margin-bottom:14px}
.turn{display:inline-block;background:var(--warn);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;margin:6px 0 0}
.clue{border:3px dashed var(--c,var(--cover));border-radius:14px;padding:16px 18px;margin:6px 0 14px;background:#fbfdfc}
.clue .lab{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--c,var(--cover))}
.clue p{font-size:21px;font-weight:700;margin:4px 0 0;line-height:1.45;white-space:pre-line}
.unlock{display:grid;gap:10px;max-width:360px;margin-top:6px}
.task{margin-top:16px}
.bulbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0;max-width:460px}
.bulb{font:inherit;border:2px solid var(--ink);border-radius:14px;background:var(--card);padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.bulb .lamp{width:38px;height:38px;border-radius:50%;background:#d8dee2;border:2px solid var(--ink)}
.bulb .v{font-family:var(--f-mono);font-weight:700;font-size:18px}
.bulb .bit{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.bulb[aria-pressed="true"]{background:#fff8dc}
.bulb[aria-pressed="true"] .lamp{background:var(--gold);box-shadow:0 0 16px var(--gold)}
.target{font-size:20px;font-weight:900}
.target .mono{font-size:30px;color:var(--c)}
.sum{font-family:var(--f-mono);font-size:18px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{font:inherit;text-align:left;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:12px 14px;cursor:pointer;color:var(--ink)}
.opt.wrong{border-color:var(--bad);background:#fde9e6;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cipher,.plain{font-family:var(--f-mono);font-size:clamp(22px,5vw,32px);font-weight:700;letter-spacing:.12em;word-break:break-word}
.plain{color:var(--c)}
.wheel{display:flex;align-items:center;gap:12px;margin:14px 0}
.wheel input{flex:1;accent-color:var(--c)}
.alpha{overflow-x:auto;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:12px}
.alpha table{border-collapse:collapse;font-family:var(--f-mono);font-size:14px}
.alpha td{padding:2px 5px;text-align:center}
.alpha tr+tr td{color:var(--c);font-weight:700}
.alpha th{font-size:12px;font-weight:700;text-align:left;padding-right:8px;white-space:nowrap;color:var(--muted)}
.maze{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;max-width:330px;margin:14px 0;aspect-ratio:1}
.cell{border-radius:6px;background:#f4f7f6;border:1px solid var(--line);position:relative;display:grid;place-items:center;font-size:12px;font-weight:700}
.cell.wall{background:var(--ink);border-color:var(--ink)}
.cell.goal{background:repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%) 0 0/12px 12px}
.cell.start{background:#dfeee7}
.cell.crash{background:var(--bad)}
.cell.trail{background:#dbe6fb}
.robot{width:70%;height:70%;background:var(--c);border-radius:6px;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.robot::before,.robot::after{content:"";position:absolute;top:30%;width:18%;height:22%;background:#fff;border-radius:2px}
.robot::before{left:22%}.robot::after{right:22%}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;border:2px dashed var(--line);border-radius:12px;padding:8px;align-items:center}
.prog .cmd{font-family:var(--f-mono);font-weight:700;background:var(--c);color:#fff;border-radius:8px;padding:4px 10px;font-size:18px}
.prog .cmd.now{outline:3px solid var(--gold)}
.pad{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pad .btn{font-size:22px;padding:8px 18px}
.result{text-align:center;padding:10px 0}

/* Done */
.passcode{font-family:var(--f-mono);font-size:clamp(32px,8.5vw,54px);font-weight:700;letter-spacing:.12em;text-align:center;background:var(--cover);color:var(--gold);border-radius:14px;padding:14px 10px;margin:12px 0}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:6px;margin:12px 0}
.mini div{aspect-ratio:1;border-radius:50%;border:3px double currentColor;display:grid;place-items:center;font-weight:900;font-size:13px;opacity:.85}
.mini div.no{color:var(--line)!important;border-style:dashed}
.sumgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.sumgrid div{background:var(--page);border-radius:12px;padding:10px}
.sumgrid b{display:block;font-family:var(--f-mono);font-size:26px}

/* Teacher */
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:18px;margin-bottom:18px;min-width:0}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{border-top:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.tbl th{font-size:13px;color:var(--muted);white-space:nowrap}
.tbl td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.board.bigmode table{font-size:24px}
.board.bigmode td.num{font-size:28px}
.qr{display:grid;place-items:center;background:#fff;padding:12px;border-radius:12px;margin-top:12px;min-height:40px;line-height:0}
.qr img{width:min(100%,360px)!important;height:auto!important;image-rendering:pixelated}
.qr p{line-height:1.5}
details summary{cursor:pointer;font-weight:900}
.warnbox{background:var(--warn);border:2px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:15px;margin:10px 0}
.warnbox ul{margin:4px 0 0;padding-left:20px}
.ed-list{display:grid;gap:14px;margin-top:12px}
.ed-st{border:2px solid var(--line);border-left:8px solid var(--c,var(--cover));border-radius:12px;padding:12px 14px;background:#fbfdfc}
.ed-st .tag{font-size:12px;font-weight:700;background:var(--warn);border:1px solid var(--gold);border-radius:999px;padding:0 8px}
.ed-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin-top:8px}
@media (max-width:600px){.ed-grid{grid-template-columns:minmax(0,1fr)}}
.ed-grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.ed-grid .full{grid-column:1/-1}
.ed-grid input,.ed-grid textarea,.ed-grid select,.setrow input{font:inherit;font-size:16px;font-weight:400;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.ed-grid textarea{min-height:64px;resize:vertical}
.setrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.setrow label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted);width:130px}
.teamlist{margin-top:12px;background:rgba(255,255,255,.08);border:1px solid rgba(229,181,68,.5);border-radius:10px;padding:10px 12px;font-size:15px;color:#fff}
.teamlist b{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.chips button[aria-pressed="true"]{background:#f3d6d2;border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
.team{border:2px solid var(--line);border-top:8px solid var(--c,var(--cover));border-radius:12px;padding:10px 12px;background:#fbfdfc;min-width:0}
.team h4{margin:0 0 6px;font-size:16px}
.team.unassigned{border-top-color:var(--bad);background:#fff7f5}
.tm-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;padding:3px 0;border-top:1px dashed var(--line)}
.tm-row:first-of-type{border-top:0}
.tm-row select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:1px 4px;background:var(--card);color:var(--ink)}
.numin{font:inherit;width:76px;border:2px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--card);color:var(--ink)}
.bigteams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.bigteams .team h4{font-size:24px}
.bigteams .tm-row{font-size:20px}

<script>
(() => {

const BANK_VER = 2;
/* 出發題：燈泡 1 = 亮、0 = 暗，答對才可以出發 */

/* ================= 站點類型 ================= */
const KINDS = {

  lib:  { label:'找密碼 → 解鎖「密碼信」', short:'找密碼＋挑戰' },

/* 內置電腦挑戰 */
const CH = {
  bin: { title:'二進制密碼鎖', intro:'電腦裏所有資料都是 0 和 1。每個燈泡代表一個數字，開燈的數字加起來，就是密碼。砌出密碼，打開保險箱！',
    rounds:[13, 22], hint:'由最大的燈泡開始想：密碼夠不夠 16？夠就開燈，再看 8、4、2、1。' },
  dt: { title:'3D 打印偵探', intro:'仔細看看這裏的 3D 打印作品，可以拿起來摸一摸，再回答問題。',
    qs:[
      { q:'3D 打印機是怎樣造出物件的？', opts:['一層一層疊上去','把一大塊材料切出來','倒入模具一次完成'], a:0 },
      { q:'用手摸作品的側面，你會感覺到甚麼？', opts:['一條一條幼紋（每一層）','完全光滑像玻璃','有毛像毛巾'], a:0 },
      { q:'按「打印」之前，設計師要先做甚麼？', opts:['用電腦畫出 3D 模型','用紙摺一個樣板','甚麼都不用做'], a:0 }
    ], hint:'看看打印機的噴嘴怎樣移動：它每次只畫一層薄薄的膠。' },
  lib: { title:'密碼信', intro:'有人留下一封密碼信。每個英文字母都向後移了幾個位。拉動密碼輪，找出原本的訊息。',
    cipher:'UHDG PRUH ERRNV', question:'解開後，訊息最後一個英文字是甚麼？', answer:['BOOKS'], hint:'把密碼輪拉到 3 附近試試。' },
  maze: { title:'機械人迷宮', intro:'寫一段程式，帶機械人由起點走到終點旗。按箭咀加入指令，寫好整段再按「執行」。',
    map:['S..#..','##.#.#','.....#','.###..','...##.','##...G'], maxSteps:14, hint:'第一步：向右走兩格，然後向下。' }
};

/* ================= 題庫：15 題自由選做（老師在老師頁修改） ================= */
function bankConfig(){
  let n = 0;
  const Q = (lv, name, place, q, a, hint, b) => Object.assign({ id: 'b' + (++n), type: 'find', lv, name, place, q, a, hint: hint || '', task: '', sample: false, qB: '', aB: '', hintB: '' }, b || {});
  return { m: 30, g: 10, bankVer: BANK_VER, start: startDefault(), s: [
    Q(1, '神秘小屋', '地下', '地下有一間白色小屋，門外寫着它的名字。這間小屋叫甚麼名字？（英文）', 'AI Sport Zone', ''),
    Q(1, '籃板牌子', '地下 · 籃球場', '學校籃球場的籃板是甚麼牌子？（英文）', 'H2SPORT、HSPORT', '看看籃板的左下角。'),
    Q(2, '校徽書本', '地下', '學校校徽上一共有多少個書本圖案？', '9', ''),
    Q(2, '水池植物', '地下 · 禮堂旁', '禮堂旁的水池上，漂浮着甚麼植物？', '睡蓮、蓮花', '它的葉子平平地浮在水面，名字和「睡覺」有關。'),
    Q(2, '水火箭紀錄', '地下', '本校在 2013 年創下「最多水火箭同時發射」世界紀錄，一共發射了多少枚水火箭？', '1056', '牆上有兩塊紀錄牌，留意年份。',
      { qB: '本校在 2011 年創下「最多水火箭同時發射」世界紀錄，一共發射了多少枚水火箭？', aB: '693' }),
    Q(2, '中藥圖鑑', '地下 · 中藥園', '中藥園「藥食同源」圖鑑上，在「石斛」上面的是哪一種藥材？', '枸杞', '石斛在圖鑑最左邊的第二行。'),
    Q(3, '發明展', '地下', '本校同學曾參加日內瓦國際發明展並獲獎。證書上的日期是哪一天？（用 DD/MM/YYYY 格式作答，例如 05/01/2025）', '14/03/2026、14/3/2026', '證書是法文的：mars 即是三月。'),
    Q(1, '烏龍茶', '地下 · 售賣機', '學校售賣機中，「淳茶舍烏龍茶」賣多少錢？（只寫數字）', '10', ''),
    Q(2, '新大樓', '地下', '本校新教學大樓落成至今有多少年？（找出落成碑記上的年份，再計算）', '20', '碑上的年份是用中文數字寫的。',
      { qB: '新教學大樓在哪一天舉行開幕典禮？找出碑記上的日子，用 DD/MM 格式作答（例如 05/01）。', aB: '23/03、23/3', hintB: '碑上的日子是用中文數字寫的。' }),
    Q(1, '掛牆植物', '1/F · 走廊', '一樓走廊牆上高高掛着的植物，一共有多少棵？', '6', '走廊兩邊都要看。'),
    Q(3, '工場算術', '1/F · 111 室', '（寫有 Light 的燈掣數目 + 空中拖板數目）÷ 冷氣機數目 = ？', '4', '冷氣機的數目，可以看電掣板上寫着 ROOM COOLER 的掣。',
      { qB: '（寫有 Light 的燈掣數目 + 冷氣機數目）× 2 = ？', aB: '14' }),
    Q(1, '1B 堂名', '2/F', '1B 課室的堂名是甚麼？', '蔡榮生堂', ''),
    Q(3, '鍵盤密碼', '2/F · 電腦室', '破解密碼「△◯◇」：\nQ W E R △\n◯ S D F G\nC V ◇ N M', 'TAB', '看看電腦鍵盤，每一行由左至右是哪幾個字母？'),
    Q(1, '圖書館', '3/F · 圖書館', '圖書館最遲幾點關門？', '5:15pm、5:15、17:15、下午5:15、下午5時15分', '',
      { qB: '圖書館午飯時間幾點開門？', aB: '1:20pm、1:20、13:20、下午1:20、下午1時20分' }),
    Q(2, '機械人場地', '3/F · N304 室', 'N304 室中間的機械人比賽場地，是屬於哪一個機械人比賽的？（英文）', 'VEX IQ', '')
  ] };
}
function rid(){ return Math.random().toString(36).slice(2, 7); }

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }
function twoStep(btn, fn){
  if (btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = btn.dataset.label; fn(); return; }
  btn.dataset.label = btn.textContent; btn.dataset.armed = '1'; btn.textContent = '再按一次確定';
  setTimeout(() => { if (btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = btn.dataset.label; } }, 3000);
}
/* 學生名單（IT精英班，A組、B組） */
const ROSTER = {
  A: { label:'A組', time:'09:45–10:55', list:[['6A',3,'陳溢知'],['6A',4,'鄭汶靜'],['6A',6,'張子雋'],['6A',9,'關祉盈'],['6B',17,'謝沁悅'],['6B',18,'黃偕齡'],['6B',20,'王梓柔'],['6C',2,'陳芷瀅'],['6C',4,'陳紫晴'],['6C',5,'張梓悠'],['6C',6,'黃俊曦'],['6C',7,'許鈞堯'],['6C',13,'梁信宏'],['6C',14,'廖梓皓'],['6C',16,'吳肇浠'],['6C',20,'葉家希'],['6C',21,'余凱霖'],['6D',1,'陳軒霆'],['6D',3,'周芷澄'],['6D',4,'鄭思澈'],['6E',10,'劉芷澄'],['6E',17,'吳子樂'],['6E',18,'彭思銳'],['6E',19,'鄧凱藍'],['6E',20,'曾豫澄'],['6E',23,'黃懿絢'],['6E',24,'黃耀翰']] },
  B: { label:'B組', time:'11:05–12:15', list:[['6A',10,'關靖諭'],['6A',11,'賴柏聰'],['6A',12,'劉穎潼'],['6A',13,'李鎧浚'],['6A',17,'柯天瑜'],['6A',20,'溫焯嵐'],['6A',21,'黃祖澤'],['6B',1,'陳銘濬'],['6B',2,'陳栢昊'],['6B',5,'莊敬榆'],['6B',6,'蔡梓妍'],['6B',9,'葉藹琳'],['6B',15,'吳柏宏'],['6D',5,'周曉穎'],['6D',10,'劉奕彤'],['6D',12,'史宏迪'],['5D',13,'戴悅'],['6D',19,'余卓燊'],['6E',1,'陳晞彤'],['6E',3,'鄒穎薇'],['6E',4,'周懿樂'],['6E',5,'徐敏堯'],['6E',6,'郭希唯'],['6E',7,'鄺康源'],['6E',9,'林俊宇'],['6E',14,'李愷盈'],['6E',15,'廖熙雯']] }
};
const ALL = Object.entries(ROSTER).flatMap(([g, x]) => x.list.map(r => ({ id: r[0] + '-' + r[1], cls: r[0], num: r[1], name: r[2], grp: g })));
const BYID = Object.fromEntries(ALL.map(p => [p.id, p]));
const pName = id => { const p = BYID[id]; return p ? `${p.cls} ${p.num} ${p.name}` : id; };
const pShort = id => { const p = BYID[id]; return p ? p.name : id; };
const mmss = sec => { const s = Math.max(0, Math.floor(Math.abs(sec))); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function fnv(str){ let h = 2166136261; for (const ch of str){ h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function b64url(bytes){ let s = ''; for (const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function fromB64url(str){ str = str.replace(/-/g,'+').replace(/_/g,'/'); while (str.length % 4) str += '='; const s = atob(str); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }

/* 答案比對：不分大小寫、全形半形、空格標點；中文數字當阿拉伯數字；答案是數字時，學生寫「8 盆」也算對 */
const CN = { '零':0,'〇':0,'一':1,'二':2,'兩':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9 };
function cnNum(seq){
  let total = 0, cur = 0;
  for (const ch of seq){
    if (ch in CN) cur = CN[ch];
    else if (ch === '十'){ total += (cur || 1) * 10; cur = 0; }
    else if (ch === '百'){ total += (cur || 1) * 100; cur = 0; }
  }
  return String(total + cur);
}
function norm(s){
  s = String(s || '').replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).toUpperCase();
  s = s.replace(/[^\p{L}\p{N}]/gu, '');
  return s.replace(/[零〇一二兩两三四五六七八九十百]+/g, cnNum);
}
const ansHash = s => (fnv(SALT + '|' + norm(s)) % 2176782336).toString(36);
function candidates(input){ const n = norm(input), d = n.replace(/\D/g, ''); return d && d !== n ? [n, d] : [n]; }
function checkAns(input, hashes){ return candidates(input).some(c => c && hashes.includes((fnv(SALT + '|' + c) % 2176782336).toString(36))); }

/* ================= 題目設定：老師版（有答案） → 學生版（答案只存加密） ================= */
let TCFG = S.get('hunt-teacher', null);
if (!TCFG || !Array.isArray(TCFG.s) || TCFG.s.every(x => x.sample)) TCFG = Object.assign(bankConfig(), TCFG && Array.isArray(TCFG.teams) ? { teams: TCFG.teams, absent: TCFG.absent || [] } : {});
if (TCFG.bankVer !== BANK_VER){
  /* 舊設定升級：加入雙數組版本、出發題，第 7 題加「蓮花」，取消「請到場核對」 */
  const bank = bankConfig().s, byName = Object.fromEntries(bank.map(b => [b.name, b]));
  TCFG.s.forEach(x => {
    delete x.check;
    const b = byName[x.name]; if (!b) return;
    if (!TCFG.s.some(y => y.id === b.id)) x.id = b.id;
    if (x.name === '水池植物' && norm(x.a) === norm('睡蓮')) x.a = b.a;
    if (!x.qB && b.qB){ x.qB = b.qB; x.aB = b.aB; x.hintB = b.hintB; }
  });
  if (!TCFG.start) TCFG.start = startDefault();
  TCFG.bankVer = BANK_VER;
}
TCFG.s.forEach(x => { if (!(x.lv >= 1 && x.lv <= 3)) x.lv = 1; ['qB', 'aB', 'hintB'].forEach(f => { if (typeof x[f] !== 'string') x[f] = ''; }); });
if (!TCFG.start || typeof TCFG.start !== 'object') TCFG.start = Object.assign(startDefault(), { on: false });
if (!Array.isArray(TCFG.start.hints)) TCFG.start.hints = [];
if (!Array.isArray(TCFG.teams)) TCFG.teams = [];
if (!Array.isArray(TCFG.absent)) TCFG.absent = [];
const saveT = () => S.set('hunt-teacher', TCFG);
const splitAns = a => String(a || '').split(/[、|｜\n]/).map(v => v.trim()).filter(Boolean);
const bitsOK = b => /^[01]{1,8}$/.test(String(b || ''));
function compileStart(sg){
  if (!sg || !sg.on || !bitsOK(sg.bulbs) || !splitAns(sg.a).length) return null;
  return { bulbs: sg.bulbs, every: Math.max(10, Math.min(300, +sg.every || 40)), hints: (sg.hints || []).map(h => String(h || '').trim()).filter(Boolean),
    room: sg.show === 'room', ans: splitAns(sg.a).map(ansHash) };
}
function compile(t){
  return { m: t.m, g: (t.teams && t.teams.length) || t.g, teams: (t.teams || []).map(x => x.slice()), demo: t.s.some(x => x.sample),
    start: compileStart(t.start),
    s: t.s.map(x => { const b = x.type !== 'chk' && String(x.qB || '').trim() && splitAns(x.aB).length;
      return { id: x.id, type: x.type, lv: x.lv || 1, name: x.name, place: x.place, q: x.q, hint: x.hint, task: x.task,
        ans: splitAns(x.a).map(ansHash), qB: b ? x.qB : '', ansB: b ? splitAns(x.aB).map(ansHash) : [], hintB: b ? (x.hintB || '') : '' }; }) };
}
/* QR 碼要短：沒有改動的題庫題目只傳編號，組員只傳名單編號 */
const rowOf = x => [x.id, x.type, x.name, x.place, x.q, x.hint, x.task, x.ans, x.lv || 1, x.qB || '', x.ansB || [], x.hintB || ''];
let BANK_ROWS = null, START_DEF = null;
const bankRows = () => BANK_ROWS || (BANK_ROWS = compile(bankConfig()).s.map(rowOf));
const startDef = () => START_DEF || (START_DEF = JSON.stringify(compileStart(startDefault())));
const ALLIDX = Object.fromEntries(ALL.map((p, i) => [p.id, i]));
function packCfg(c){
  const bank = bankRows().map(r => JSON.stringify(r));
  const rows = c.s.map(x => { const r = rowOf(x), k = bank.indexOf(JSON.stringify(r)); return k >= 0 ? k : r; });
  const teams = (c.teams || []).map(t => t.map(id => id in ALLIDX ? ALLIDX[id] : id));
  const sg = c.start ? (JSON.stringify(c.start) === startDef() ? 1 : [c.start.bulbs, c.start.every, c.start.hints, c.start.ans, c.start.room ? 1 : 0]) : 0;
  const arr = [2, c.m, c.g, c.demo ? 1 : 0, rows, teams, sg];
  return 'H1' + b64url(new TextEncoder().encode(JSON.stringify(arr)));
}
function unpackCfg(code){
  try {
    if (!/^H1/.test(code)) return null;
    const arr = JSON.parse(new TextDecoder().decode(fromB64url(code.slice(2))));
    if (!(arr[0] === 1 || arr[0] === 2) || !Array.isArray(arr[4])) return null;
    const s = arr[4].slice(0, MAX_STATIONS).map(r => typeof r === 'number' ? bankRows()[r] : r).filter(Array.isArray).map(r => ({ id: String(r[0]), type: KINDS[r[1]] ? r[1] : 'find', name: String(r[2] || ''), place: String(r[3] || ''), q: String(r[4] || ''), hint: String(r[5] || ''), task: String(r[6] || ''), ans: Array.isArray(r[7]) ? r[7].map(String) : [], lv: Math.max(1, Math.min(3, +r[8] || 1)),
      qB: String(r[9] || ''), ansB: Array.isArray(r[10]) ? r[10].map(String) : [], hintB: String(r[11] || '') }));
    if (!s.length) return null;
    const teams = Array.isArray(arr[5]) ? arr[5].slice(0, 15).map(t => Array.isArray(t) ? t.map(v => typeof v === 'number' ? (ALL[v] || {}).id : String(v)).filter(Boolean) : []) : [];
    const r6 = arr[6];
    const start = r6 === 1 ? JSON.parse(startDef()) : Array.isArray(r6) && bitsOK(r6[0]) && Array.isArray(r6[3]) && r6[3].length
      ? { bulbs: String(r6[0]), every: Math.max(10, Math.min(300, +r6[1] || 40)), hints: Array.isArray(r6[2]) ? r6[2].slice(0, 6).map(String) : [], ans: r6[3].map(String), room: !!r6[4] } : null;
    return { m: Math.max(5, Math.min(90, +arr[1] || 30)), g: teams.length || Math.max(1, Math.min(15, +arr[2] || 10)), teams, demo: !!arr[3], start, s };
  } catch(e){ return null; }
}
function withId(c){ c.id = fnv(packCfg(c)).toString(36); return c; }

/* 學生用哪一份題目：開場 QR 碼帶來的 > 這部機上次用的 > 老師在這部機設定的 */
let CFG = null;
(function loadCfg(){
  const h = location.hash.replace('#', '');
  const fromHash = unpackCfg(h);
  if (fromHash){ CFG = withId(fromHash); S.set('hunt-config', packCfg(CFG)); return; }
  const saved = unpackCfg(S.get('hunt-config', '') || '');
  CFG = withId(saved || compile(TCFG));
})();
const ST = () => CFG.s;

/* 核對碼：組別、分數、用時、完成站點 + 檢查位，10 個字 */
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function h12(v){ return fnv(SALT + ':' + v) & 4095; }
function makeCode(group, score, mins, mask){
  const v = group + Math.min(score, 511) * 16 + Math.min(mins, 63) * 8192 + mask * 524288;
  let n = v * 4096 + h12(v), s = '';
  for (let i = 0; i < 10; i++){ s = B32[n % 32] + s; n = Math.floor(n / 32); }
  return s.slice(0, 5) + '-' + s.slice(5);
}
function readCode(str){
  const c = String(str).toUpperCase().replace(/O/g, '0').replace(/[IL]/g, '1').replace(/[^0-9A-Z]/g, '');
  if (c.length !== 10) return null;
  let n = 0; for (const ch of c){ const k = B32.indexOf(ch); if (k < 0) return null; n = n * 32 + k; }
  const chk = n % 4096, v = Math.floor(n / 4096);
  if (h12(v) !== chk) return null;
  return { group: v % 16, score: Math.floor(v / 16) % 512, mins: Math.floor(v / 8192) % 64, mask: Math.floor(v / 524288) % 65536, code: c.slice(0, 5) + '-' + c.slice(5) };
}
const popcount = m => { let n = 0; while (m){ n += m & 1; m >>= 1; } return n; };

/* ================= 學生狀態 ================= */
let st = S.get('hunt-state', null);
const fresh = () => ({ cfg: CFG.id, group:0, team:'', start:0, finished:0, passed:false, gateT:0, gw:0, gNext:0, s:{} });
if (!st || typeof st !== 'object' || !st.s || st.cfg !== CFG.id) st = fresh();
const save = () => S.set('hunt-state', st);
const rec = id => st.s[id] = st.s[id] || { unlocked:false, done:false, failed:false, score:0, wrong:0, cw:0, hint:false, hint2:false };
const total = () => ST().reduce((a, x) => a + (st.s[x.id] && st.s[x.id].done ? st.s[x.id].score : 0), 0);
const doneCount = () => ST().filter(x => st.s[x.id] && st.s[x.id].done).length;
const elapsed = () => st.start ? ((st.finished || Date.now()) - st.start) / 1000 : 0;
const basePts = x => LV_PTS[(x.lv || 1) - 1];
function stationScore(x, r){
  const base = basePts(x); if (r.failed) return 0;
  let p = base * TRY_PCT[Math.min(r.wrong || 0, MAX_TRIES - 1)];
  p -= base * HINT_PCT * ((r.hint ? 1 : 0) + (r.hint2 ? 1 : 0));
  p -= base * .1 * (r.cw || 0);
  return Math.max(Math.round(base * .1), Math.round(p));
}
const failedCount = () => ST().filter(x => st.s[x.id] && st.s[x.id].failed).length;
const colorOf = i => COLORS[i % COLORS.length];
/* 防抄：雙數組用 B 版本（如有） */
const isB = x => st.group % 2 === 0 && !!x.qB && Array.isArray(x.ansB) && x.ansB.length > 0;
const verOf = x => isB(x) ? { q: x.qB, ans: x.ansB, hint: x.hintB || x.hint } : { q: x.q, ans: x.ans, hint: x.hint };
const weightOf = (bits, k) => 2 ** (bits.length - 1 - k);
const bulbsHTML = (bits, cls, showW) => `<div class="gbulbs ${cls || ''}" role="img" aria-label="${[...bits].map(b => b === '1' ? '亮' : '暗').join('、')}">${[...bits].map((b, k) => `<div class="gb${b === '1' ? ' on' : ''}"><span class="glass"></span><span class="base"></span>${showW ? `<span class="w">${weightOf(bits, k)}</span>` : ''}</div>`).join('')}</div>`;
const bitsSum = bits => { const parts = [...bits].map((b, k) => b === '1' ? weightOf(bits, k) : 0).filter(Boolean); return `${bits} → ${parts.join(' + ') || 0} = ${parseInt(bits, 2)}`; };
const teamOf = g => (CFG.teams && CFG.teams[g - 1]) || [];
function turnText(){ const t = teamOf(st.group); return t.length ? pShort(t[doneCount() % t.length]) + ' 操作' : '第 ' + ((doneCount() % 4) + 1) + ' 號隊員操作'; }

const TASKS = {
  bin(x, el, ok, bad){
    let round = 0; const vals = [16, 8, 4, 2, 1]; let on = [0,0,0,0,0];
    const draw = () => {
      const sum = vals.reduce((a, v, i) => a + (on[i] ? v : 0), 0);
      el.innerHTML = `<p class="target">第 ${round+1} / ${x.rounds.length} 個保險箱　密碼：<span class="mono">${x.rounds[round]}</span></p>
        <div class="bulbs">${vals.map((v, i) => `<button class="bulb" data-i="${i}" aria-pressed="${!!on[i]}"><span class="lamp"></span><span class="v">${v}</span><span class="bit">${on[i] ? 1 : 0}</span></button>`).join('')}</div>
        <p class="sum">二進制：<b>${on.join('')}</b>　加起來 = <b>${sum}</b></p>
        <button class="btn primary" id="try">開鎖</button><p class="msg" id="m2"></p>`;
      el.querySelectorAll('.bulb').forEach(b => b.onclick = () => { on[+b.dataset.i] ^= 1; draw(); });
      $('#try').onclick = () => {
        if (sum === x.rounds[round]){
          round++; on = [0,0,0,0,0];
          if (round >= x.rounds.length) ok(); else { draw(); $('#m2').className = 'msg ok'; $('#m2').textContent = '第一個保險箱打開了！再開下一個。'; }
        } else { bad(); $('#m2').className = 'msg bad'; $('#m2').textContent = `加起來是 ${sum}，不是 ${x.rounds[round]}。再試試！`; }
      };
    };
    draw();
  },
  dt(x, el, ok, bad){
    let k = 0;
    const draw = () => {
      const q = x.qs[k];
      el.innerHTML = `<p class="small muted">第 ${k+1} / ${x.qs.length} 題</p><h3>${esc(q.q)}</h3>
        <div class="opts">${q.opts.map((o, i) => ({ o, i })).sort(() => Math.random() - .5).map(({ o, i }) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><p class="msg" id="m2"></p>`;
      el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        if (+b.dataset.i === q.a){ k++; if (k >= x.qs.length) ok(); else draw(); }
        else { bad(); b.classList.add('wrong'); b.disabled = true; $('#m2').className = 'msg bad'; $('#m2').textContent = '不是這個，再想想！'; }
      });
    };
    draw();
  },
  lib(x, el, ok, bad){
    let sh = 0; const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const dec = (t, n) => t.replace(/[A-Z]/g, c => A[(A.indexOf(c) - n + 26) % 26]);
    el.innerHTML = `<p class="small muted" style="margin:0">密碼信</p><div class="cipher">${esc(x.cipher)}</div>
      <div class="wheel"><span class="small">密碼輪</span><input type="range" id="sh" min="0" max="25" value="0" aria-label="密碼輪"><b class="mono" id="shv">0</b></div>
      <div class="alpha" id="alpha"></div>
      <p class="small muted" style="margin:0">解開後</p><div class="plain" id="plain"></div>
      <div class="unlock"><label class="small" for="ans2"><b>${esc(x.question)}</b></label><input id="ans2" class="code" autocomplete="off" autocapitalize="characters"><button class="btn primary" id="sub">提交答案</button><p class="msg" id="m2"></p></div>`;
    const upd = () => {
      $('#shv').textContent = sh; $('#plain').textContent = dec(x.cipher, sh);
      $('#alpha').innerHTML = `<table><tr><th>密碼字母</th>${[...A].map(c => `<td>${c}</td>`).join('')}</tr><tr><th>原本字母</th>${[...A].map(c => `<td>${dec(c, sh)}</td>`).join('')}</tr></table>`;
    };
    $('#sh').oninput = e => { sh = +e.target.value; upd(); };
    upd();
    $('#sub').onclick = () => {
      if (x.answer.map(norm).includes(norm($('#ans2').value))) ok();
      else { bad(); $('#m2').className = 'msg bad'; $('#m2').textContent = '答案不正確，先把整句解開再試。'; }
    };
  },
  maze(x, el, ok, bad){
    const M = x.map, R = M.length, C = M[0].length; let sr = 0, sc = 0;
    M.forEach((row, i) => { const j = row.indexOf('S'); if (j >= 0){ sr = i; sc = j; } });
    let prog = [], pos = [sr, sc], running = false, trail = [], crash = null, now = -1;
    const D = { '↑':[-1,0], '↓':[1,0], '←':[0,-1], '→':[0,1] };
    const draw = msg => {
      el.innerHTML = `<div class="maze">${M.map((row, i) => [...row].map((ch, j) => {
          const cls = ch === '#' ? 'wall' : ch === 'G' ? 'goal' : ch === 'S' ? 'start' : '';
          const t = trail.some(p => p[0] === i && p[1] === j) ? ' trail' : '';
          const c = crash && crash[0] === i && crash[1] === j ? ' crash' : '';
          return `<div class="cell ${cls}${t}${c}">${pos[0] === i && pos[1] === j ? '<span class="robot"></span>' : ''}</div>`; }).join('')).join('')}</div>
        <p class="small muted" style="margin:0">程式（${prog.length} / ${x.maxSteps} 步）</p>
        <div class="prog">${prog.length ? prog.map((p, i) => `<span class="cmd${i === now ? ' now' : ''}">${p}</span>`).join('') : '<span class="small muted">按下面的箭咀加入指令</span>'}</div>
        <div class="pad">${Object.keys(D).map(k => `<button class="btn" data-k="${k}" ${running ? 'disabled' : ''} aria-label="${{'↑':'向上','↓':'向下','←':'向左','→':'向右'}[k]}">${k}</button>`).join('')}</div>
        <div class="row"><button class="btn sm" id="del" ${running ? 'disabled' : ''}>刪除最後一步</button><button class="btn sm" id="clr" ${running ? 'disabled' : ''}>清除</button><button class="btn primary" id="run" ${running || !prog.length ? 'disabled' : ''}>▶ 執行程式</button></div>
        <p class="msg ${msg && msg[0] === '!' ? 'bad' : ''}">${msg ? esc(msg.replace(/^!/, '')) : ''}</p>`;
      el.querySelectorAll('.pad .btn').forEach(b => b.onclick = () => { if (prog.length < x.maxSteps){ prog.push(b.dataset.k); crash = null; trail = []; pos = [sr, sc]; draw(); } else draw('!最多 ' + x.maxSteps + ' 步。'); });
      $('#del').onclick = () => { prog.pop(); draw(); };
      $('#clr').onclick = () => { prog = []; trail = []; crash = null; pos = [sr, sc]; draw(); };
      $('#run').onclick = run;
    };
    const run = () => {
      running = true; pos = [sr, sc]; trail = [[sr, sc]]; crash = null; now = -1; draw('機械人出發！');
      let k = 0;
      const stepT = setInterval(() => {
        if (!document.body.contains(el)){ clearInterval(stepT); return; }
        if (k >= prog.length){
          clearInterval(stepT); running = false; now = -1;
          if (M[pos[0]][pos[1]] === 'G'){ draw('到達終點！'); setTimeout(ok, 500); }
          else { bad(); draw('!程式完了，但機械人未到終點。加多幾步再試。'); }
          return;
        }
        now = k; const [dr, dc] = D[prog[k]]; const nr = pos[0] + dr, nc = pos[1] + dc;
        if (nr < 0 || nc < 0 || nr >= R || nc >= C || M[nr][nc] === '#'){
          clearInterval(stepT); running = false; crash = (nr < 0 || nc < 0 || nr >= R || nc >= C) ? pos.slice() : [nr, nc]; bad();
          now = -1; draw(`!第 ${k+1} 步撞牆了！修改程式再試。`); return;
        }
        pos = [nr, nc]; trail.push(pos.slice()); k++; draw('機械人行走中……');
      }, 380);
    };
    draw();
  }
};

      <label>每隔幾秒給一個提示<input data-g="every" type="number" min="10" max="300" value="${sg.every}"></label>
      <label>燈泡在哪裏顯示<select data-g="show"><option value="ipad"${sg.show !== 'room' ? ' selected' : ''}>iPad 和投影幕都顯示</option><option value="room"${sg.show === 'room' ? ' selected' : ''}>只在投影幕／現場（iPad 不顯示）</option></select></label>
      ${[0, 1, 2, 3].map(k => `<label class="full">提示 ${k + 1}（留空 = 不用）<input data-h="${k}" maxlength="60" value="${esc(sg.hints[k] || '')}"></label>`).join('')}
    </div>
    <div class="row" style="margin-top:12px"><a class="btn primary" href="#startshow">投影出發題</a><span class="small muted">投影頁有大燈泡、提示計時和「顯示答案」。</span></div>`;
  $('#sgOn').onchange = e => { sg.on = e.target.checked; changed(); };
  el.querySelectorAll('[data-g]').forEach(inp => {
    const f = inp.dataset.g;
    const set = () => { sg[f] = f === 'every' ? Math.max(10, Math.min(300, +inp.value || 40)) : f === 'bulbs' ? inp.value.replace(/\s/g, '') : inp.value; $('#sgPrev').innerHTML = prev(); changed(); };
    if (inp.tagName === 'SELECT') inp.onchange = set; else inp.oninput = set;
  });
  el.querySelectorAll('[data-h]').forEach(inp => inp.oninput = () => { sg.hints[+inp.dataset.h] = inp.value; changed(); });
}
let ssShown = 0, ssStart = 0, ssReveal = false;
function renderStartShow(){
  const sg = TCFG.start, bits = bitsOK(sg.bulbs) ? sg.bulbs : '10010';
  const hints = (sg.hints || []).map(h => String(h || '').trim()).filter(Boolean), every = Math.max(10, +sg.every || 40);
  const a0 = splitAns(sg.a)[0] || '', val = parseInt(bits, 2);
  app.innerHTML = `<div class="show">
    <div class="row between"><span class="eyebrow" style="color:var(--gold)">第三堂 · 校園尋寶</span>
      <div class="ctl"><button class="btn sm gold" id="ssGo">${ssStart ? '暫停提示計時' : ssShown ? '繼續提示計時' : `開始計時（每 ${every} 秒一個提示）`}</button>
      <button class="btn sm" id="ssMore" ${ssShown >= hints.length ? 'disabled' : ''}>下一個提示</button>
      <button class="btn sm" id="ssAns">${ssReveal ? '隱藏答案' : '顯示答案'}</button>
      <button class="btn sm" id="ssReset">重設</button><a class="btn sm" href="#teacher">返回控制台</a></div></div>
    <h1>出發密碼</h1>
    <p class="sub">這排燈泡藏着一個數字。破解它，在 iPad 輸入，答對才可以出發！</p>
    ${bulbsHTML(bits, 'huge', ssReveal)}
    ${ssReveal ? `<p class="reveal">${esc(bitsSum(bits))}${norm(a0) !== String(val) ? '　答案：' + esc(a0) : ''}</p>` : ''}
    <div class="ghints" id="ssH"></div>
    <p class="gnext" id="ssN"></p></div>`;
  const drawH = () => { $('#ssH').innerHTML = hints.slice(0, ssShown).map((h, k) => `<div class="ghint"><b>提示 ${k + 1}</b>${esc(h)}</div>`).join(''); };
  const upd = () => {
    if (ssStart){ const n = Math.min(hints.length, Math.floor((Date.now() - ssStart) / 1000 / every)); if (n > ssShown){ ssShown = n; drawH(); const mb = $('#ssMore'); if (mb) mb.disabled = ssShown >= hints.length; } }
    const el = $('#ssN'); if (!el) return;
    el.textContent = ssShown >= hints.length ? (hints.length ? '所有提示都出來了' : '') : ssStart ? `下一個提示：${mmss(every * (ssShown + 1) - (Date.now() - ssStart) / 1000)}` : '提示計時暫停中';
  };
  drawH(); upd();
  $('#ssGo').onclick = () => { ssStart = ssStart ? 0 : Date.now() - ssShown * every * 1000; renderStartShow(); };
  $('#ssMore').onclick = () => { if (ssShown < hints.length){ ssShown++; if (ssStart) ssStart = Date.now() - ssShown * every * 1000; renderStartShow(); } };
  $('#ssAns').onclick = e => { if (ssReveal){ ssReveal = false; renderStartShow(); } else twoStep(e.currentTarget, () => { ssReveal = true; renderStartShow(); }); };
  $('#ssReset').onclick = () => { ssShown = 0; ssStart = 0; ssReveal = false; renderStartShow(); };
  clearInterval(tick); tick = setInterval(() => { if (!$('#ssN')){ clearInterval(tick); return; } upd(); }, 500);
}

/* ---------- 分組 ---------- */
function makeTeams(n){
  const absent = new Set(TCFG.absent);
  const pool = ALL.filter(p => !absent.has(p.id)).map(p => ({ p, r: Math.random() }))
    .sort((a, b) => a.p.cls.localeCompare(b.p.cls) || a.p.grp.localeCompare(b.p.grp) || a.r - b.r).map(x => x.p);
  const teams = Array.from({ length: n }, () => []);
  pool.forEach((p, i) => { const round = Math.floor(i / n), k = i % n; teams[round % 2 ? n - 1 - k : k].push(p.id); });
  for (let i = teams.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [teams[i], teams[j]] = [teams[j], teams[i]]; }
  return teams;
}
function teamsChanged(){
  applyTeacherCfg(); renderTeams();
  const g = $('#setG'); if (g){ g.value = TCFG.teams.length || TCFG.g; g.disabled = !!TCFG.teams.length; }
  if (qrShown) showQR();
}
function renderTeams(){
  const el = $('#teamCard'); if (!el) return;
  const absent = new Set(TCFG.absent), present = ALL.filter(p => !absent.has(p.id));
  const has = TCFG.teams.length > 0, n = has ? TCFG.teams.length : Math.min(15, Math.max(2, Math.round(present.length / 5.5)));
  const placed = new Set(TCFG.teams.flat()), loose = present.filter(p => !placed.has(p.id)).map(p => p.id);
  const sizes = n ? `每組 ${Math.floor(present.length / n)}${present.length % n ? '–' + Math.ceil(present.length / n) : ''} 人` : '';
  const moveSel = (id, cur) => `<select data-move="${id}" aria-label="調組">${cur ? '' : '<option value="">未分組</option>'}${TCFG.teams.map((_, k) => `<option value="${k}"${k === cur - 1 ? ' selected' : ''}>第 ${k + 1} 組</option>`).join('')}</select>`;
  const wasOpen = !!(el.querySelector('details') && el.querySelector('details').open);
  el.innerHTML = `<h3>分組</h3>
    <p class="small muted" style="margin:4px 0 0">名單共 ${ALL.length} 人（${Object.values(ROSTER).map(g => g.label + ' ' + g.list.length + ' 人').join('、')}）。先在「出席」點選缺席的同學，再按「自動分組」。系統會把不同班別、A 組和 B 組的同學平均分到各組。分好後可以用選單調組。分組改了，要重新產生開場 QR 碼。</p>
    <div class="row" style="margin-top:10px"><label class="small" style="font-weight:700">組數 <input class="numin" id="teamN" type="number" min="2" max="15" value="${n}"></label>
      <button class="btn primary" id="mkTeams">${has ? '重新自動分組' : '自動分組'}</button>
      ${has ? '<a class="btn" href="#teams">投影分組名單</a><button class="btn sm" id="clrTeams">取消分組</button>' : ''}
      <span class="small muted">出席 ${present.length} 人，${sizes}</span></div>
    <details style="margin-top:10px"${wasOpen ? ' open' : ''}><summary>出席（缺席 ${absent.size} 人，點名字標示缺席）</summary>
      <div class="chips">${ALL.map(p => `<button type="button" data-abs="${p.id}" aria-pressed="${absent.has(p.id)}">${esc(pName(p.id))}</button>`).join('')}</div></details>
    ${has ? `<div class="teams">
      ${loose.length ? `<div class="team unassigned"><h4>未分組（${loose.length} 人）</h4>${loose.map(id => `<div class="tm-row"><span>${esc(pName(id))}</span>${moveSel(id, 0)}</div>`).join('')}</div>` : ''}
      ${TCFG.teams.map((t, k) => `<div class="team" style="--c:${colorOf(k)}"><h4>第 ${k + 1} 組 · ${t.length} 人</h4>${t.map(id => `<div class="tm-row"><span>${esc(pName(id))}</span>${moveSel(id, k + 1)}</div>`).join('')}</div>`).join('')}
    </div>` : ''}`;
  $('#mkTeams').onclick = e => {
    const go = () => { const k = Math.max(2, Math.min(15, +$('#teamN').value || n)); TCFG.teams = makeTeams(k); teamsChanged(); toast(`已分成 ${k} 組`); };
    if (has) twoStep(e.currentTarget, go); else go();
  };
  const clr = $('#clrTeams'); if (clr) clr.onclick = e => twoStep(e.currentTarget, () => { TCFG.teams = []; teamsChanged(); });
  el.querySelectorAll('[data-abs]').forEach(b => b.onclick = () => {
    const id = b.dataset.abs, set = new Set(TCFG.absent);
    if (set.has(id)) set.delete(id); else { set.add(id); TCFG.teams = TCFG.teams.map(t => t.filter(x => x !== id)); }
    TCFG.absent = [...set]; teamsChanged();
  });
  el.querySelectorAll('[data-move]').forEach(sel => sel.onchange = () => {
    if (sel.value === '') return;
    const id = sel.dataset.move, to = +sel.value;
    TCFG.teams = TCFG.teams.map(t => t.filter(x => x !== id)); TCFG.teams[to].push(id); teamsChanged();
  });
}
function renderTeamsView(){
  const t = TCFG.teams;
  app.innerHTML = `<div class="wrap" style="max-width:1200px"><div class="row between" style="margin-bottom:16px"><div><div class="eyebrow">第三堂 · 校園尋寶</div><h2 style="font-size:34px">分組名單</h2></div><a class="btn" href="#teacher">返回控制台</a></div>
    ${t.length ? `<div class="bigteams">${t.map((m, k) => `<div class="team" style="--c:${colorOf(k)}"><h4>第 ${k + 1} 組</h4>${m.map(id => `<div class="tm-row"><span>${esc(pName(id))}</span></div>`).join('')}</div>`).join('')}</div>` : '<div class="card">未分組。請在老師控制台按「自動分組」。</div>'}</div>`;
}

function renderEditor(){
  const kindOpts = sel => Object.entries(KINDS).map(([k, v]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${v.label}</option>`).join('');
  $('#edList').innerHTML = TCFG.s.map((x, k) => `<div class="ed-st" data-k="${k}" style="--c:${colorOf(k)}">
    <div class="row between"><div class="row"><b>第 ${k+1} 站</b><span class="tag" ${x.sample ? '' : 'hidden'}>範例，請修改</span>${x.qB && x.type !== 'chk' ? '<span class="ab">單／雙數組不同題</span>' : ''}</div>
      <div class="row"><button class="btn sm" data-act="up" ${k === 0 ? 'disabled' : ''} aria-label="上移">↑</button><button class="btn sm" data-act="down" ${k === TCFG.s.length - 1 ? 'disabled' : ''} aria-label="下移">↓</button><button class="btn sm" data-act="del">刪除</button></div></div>
    <div class="ed-grid">
      <label>站名<input data-f="name" maxlength="12" value="${esc(x.name)}"></label>
      <label>地點<input data-f="place" maxlength="16" value="${esc(x.place)}" placeholder="例如 一樓走廊"></label>
      <label>類型<select data-f="type">${kindOpts(x.type)}</select></label>
      <label>難度<select data-f="lv">${[1, 2, 3].map(v => `<option value="${v}"${(x.lv || 1) === v ? ' selected' : ''}>${stars(v)} ${LV_PTS[v - 1]} 分</option>`).join('')}</select></label>
      ${x.type === 'chk'
        ? `<label class="full">任務說明（學生會看到）<textarea data-f="task" maxlength="160">${esc(x.task)}</textarea></label>
           <label>完成碼（只交給大使）<input data-f="a" maxlength="20" value="${esc(x.a)}" placeholder="例如 VOTE"></label>`
        : `<label class="full">線索題目（學生要到這個地點找答案）<textarea data-f="q" maxlength="120" placeholder="例如：電腦室牆上的守則，第 3 句第 5 個字是甚麼？">${esc(x.q)}</textarea></label>
           <label>答案<input data-f="a" maxlength="60" value="${esc(x.a)}" placeholder="多個答案用「、」分隔"></label>
           <label>提示（選填，看了扣 20%）<input data-f="hint" maxlength="60" value="${esc(x.hint)}"></label>
           <details ${x.qB ? 'open' : ''}><summary>防抄：雙數組版本（選填）</summary><div class="ed-grid">
             <label class="full">雙數組線索題目（留空 = 所有組同一題）<textarea data-f="qB" maxlength="120">${esc(x.qB)}</textarea></label>
             <label>雙數組答案<input data-f="aB" maxlength="60" value="${esc(x.aB)}" placeholder="多個答案用「、」分隔"></label>
             <label>雙數組提示（留空 = 用上面的提示）<input data-f="hintB" maxlength="60" value="${esc(x.hintB)}"></label>
           </div></details>`}
    </div>
    ${CH[x.type] ? `<p class="small muted" style="margin:8px 0 0">答對後解鎖「${CH[x.type].title}」：${esc(CH[x.type].intro)}</p>` : ''}
  </div>`).join('');
  document.querySelectorAll('.ed-st').forEach(card => {
    const k = +card.dataset.k, x = TCFG.s[k];
    card.querySelectorAll('[data-f]').forEach(inp => {
      const f = inp.dataset.f;
      if (f === 'type') inp.onchange = () => { x.type = inp.value; x.sample = false; applyTeacherCfg(); renderEditor(); renderWarn(); };
      else if (f === 'lv') inp.onchange = () => { x.lv = +inp.value; applyTeacherCfg(); renderTeacher(); };
      else inp.oninput = () => { x[f] = inp.value; if (f !== 'name') x.sample = false; changed(); };
    });
    card.querySelector('[data-act=up]').onclick = () => { if (k > 0){ [TCFG.s[k-1], TCFG.s[k]] = [TCFG.s[k], TCFG.s[k-1]]; applyTeacherCfg(); renderEditor(); renderWarn(); } };
    card.querySelector('[data-act=down]').onclick = () => { if (k < TCFG.s.length - 1){ [TCFG.s[k+1], TCFG.s[k]] = [TCFG.s[k], TCFG.s[k+1]]; applyTeacherCfg(); renderEditor(); renderWarn(); } };
    card.querySelector('[data-act=del]').onclick = e => twoStep(e.currentTarget, () => { if (TCFG.s.length <= 1){ toast('最少要有 1 個站'); return; } TCFG.s.splice(k, 1); applyTeacherCfg(); renderTeacher(); });
  });
}

function renderAnswers(){
  app.innerHTML = `<div class="wrap"><div class="row between" style="margin-bottom:16px"><div><div class="eyebrow">老師及大使用 · 不要給學生看</div><h2>答案表</h2></div><a class="btn" href="#teacher">返回控制台</a></div>
    <div class="card"><div class="tbl"><table><tr><th>站</th><th>站名／地點</th><th>難度</th><th>線索或任務</th><th>答案／完成碼</th><th>大使要做</th></tr>
      ${TCFG.start.on && bitsOK(TCFG.start.bulbs) ? `<tr><td class="num">出發</td><td><b>出發題</b><br><span class="small muted">課室</span></td><td class="small">答對才可出發</td>
        <td class="small">燈泡密碼（亮 = 1，暗 = 0）${bulbsHTML(TCFG.start.bulbs, 'tiny')}<span class="mono">${esc(bitsSum(TCFG.start.bulbs))}</span></td>
        <td class="num" style="white-space:normal"><b>${splitAns(TCFG.start.a).map(esc).join('<br>')}</b></td>
        <td class="small">各組答對後才可離開課室；不要說出答案。如用真燈，按左至右「${[...TCFG.start.bulbs].map(b => b === '1' ? '亮' : '暗').join(' ')}」排好。</td></tr>` : ''}
      ${TCFG.s.map((x, i) => { const hasB = x.type !== 'chk' && x.qB.trim() && x.aB.trim(); return `<tr><td class="num">${i+1}</td><td><b>${esc(x.name)}</b><br><span class="small muted">${esc(x.place)}</span></td><td class="small"><span class="lvstar">${stars(x.lv)}</span><br>${LV_PTS[(x.lv || 1) - 1]} 分${x.type === 'find' ? '' : '<br>' + KINDS[x.type].short}</td>
        <td class="small" style="white-space:pre-line">${hasB ? '<b>單數組：</b>' : ''}${esc(x.type === 'chk' ? x.task : x.q)}${x.hint ? `<br><span class="muted">提示：${esc(x.hint)}</span>` : ''}${hasB ? `<br><b>雙數組：</b>${esc(x.qB)}${x.hintB ? `<br><span class="muted">提示：${esc(x.hintB)}</span>` : ''}` : ''}</td>
        <td class="num" style="white-space:normal">${hasB ? '<span class="small">單：</span>' : ''}<b>${splitAns(x.a).map(esc).join('<br>')}</b>${hasB ? `<br><span class="small">雙：</span><b>${splitAns(x.aB).map(esc).join('<br>')}</b>` : ''}${x.sample ? '<br><span class="small muted">（範例）</span>' : ''}</td>
        <td class="small">${x.type === 'chk' ? '看着學生完成任務，完成後才說出完成碼' : '維持秩序、提醒輪流操作；不要告訴學生答案'}</td></tr>`; }).join('')}
    </table></div></div>
    <p class="small muted">可以截圖或列印這頁給大使。</p></div>`;
}

/* ================= 路由 ================= */
function render(){
  const h = location.hash.replace('#', '');
  window.scrollTo(0, 0);
  if (h === 'teacher'){ clearInterval(tick); return renderTeacher(); }
  if (h === 'answers' || h === 'posters'){ clearInterval(tick); return renderAnswers(); }
  if (h === 'teams'){ clearInterval(tick); return renderTeamsView(); }
  if (h === 'startshow'){ clearInterval(tick); return renderStartShow(); }
  if (st.cfg !== CFG.id) st = fresh();
  if (st.finished) view = 'done';
  else if (!st.group) view = 'cover';
  else if (CFG.start && !st.passed) view = st.gateT ? 'start' : 'cover';
  else if (!st.start) view = 'cover';
  else if (view === 'cover' || view === 'start') view = 'book';
  ({ cover: renderCover, start: renderStart, book: renderBook, station: renderStation, done: renderDone })[view]();
}
window.addEventListener('hashchange', () => {
  const c = unpackCfg(location.hash.replace('#', ''));
  if (c){ const w = withId(c); if (w.id !== CFG.id){ CFG = w; S.set('hunt-config', packCfg(CFG)); st = fresh(); save(); view = 'cover'; } }
  render();
});
render();
})();
</script>
